<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gaberiella Mazzanti - Record</title>
    <style>
        /* Modern Color Palette: Teal, Steel Blue, Grey, Black, White */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px; 
            background-color: #f8f9fa; /* Light Grey background */
            color: #333; /* Dark Grey/Black text */
        }

        h1 { 
            color: #008080; /* Teal */
            text-align: center; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        table { 
            width: 90%; 
            margin: 30px auto; 
            border-collapse: collapse; 
            background: white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            border-radius: 8px;
            overflow: hidden; /* Keeps corners rounded */
        }

        thead {
            background-color: #4682B4; /* Steel Blue */
            color: white;
        }

        th { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 3px solid #008080; /* Teal accent under header */
        }

        td { 
            padding: 12px 15px; 
            border-bottom: 1px solid #e0e0e0; /* Light Grey borders */
        }

        /* Zebra Striping & Hover Effect */
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:hover { background-color: #e9ecef; } /* Subtle Grey hover */

        .back-link { 
            display: inline-block;
            margin-top: 20px; 
            color: #4682B4; /* Steel Blue */
            text-decoration: none; 
            font-weight: bold;
            transition: color 0.3s;
        }

        .back-link:hover { color: #008080; /* Changes to Teal on hover */ }

        .container { text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gaberiella Mazzanti: Win/Loss Record</h1>

        <table>
            <thead>
                <tr>
                    <th>Opponent Name</th>
                    <th>School</th>
                    <th>Result (W/L)</th>
                    <th>Score/Notes</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Example Opponent</td>
                    <td>Example High School</td>
                    <td>Win</td>
                    <td>2-0</td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>

        <a href="index.html" class="back-link">← Back to Main Profile</a>
    </div>

</body>
</html>
